name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**.png"
      - "**.jpg"
      - "**.gif"
      - "**.svg"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**.png"
      - "**.jpg"
      - "**.gif"
      - "**.svg"
  workflow_dispatch:

# Ein neuer Push auf denselben Branch/PR bricht den veralteten Lauf ab.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -r bash -n

      - name: ShellCheck
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -r shellcheck

      - name: Git diff check
        run: git diff --check
